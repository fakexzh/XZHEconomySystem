# Quest pack stock resets to these values each server-local day.
quests:
  v2:
    enabled: true
    activity-seconds: 90
    placed-block-tracking: true
    cooldown-minutes:
      easy: 5
      hard: 10
      master: 15
    daily-profit-cap:
      easy: 2500
      hard: 5000
      master: 12000
    spawner-kill-cap: 10
    trial-spawner-kill-cap: 20
    travel-max-blocks-per-second: 12
  global-event:
    min-contribution-percent: 3
    full-reward-percent: 10
    max-completions-per-day: 3
    cooldown-minutes: 30
  pack-stock:
    beginner: 50
    miner: 30
    hunter: 25
    explorer: 15
    nether: 10
    end: 5
  global-event:
    goal: 500
    reward: 200
    claims-per-day: 25

# Configurable gameplay restrictions.
restrictions:
  disable-librarian-enchanted-book-trades: true
  elytra-requires-end-visit: true
  buy-only-spawn-eggs: true

# Player utility limits.
utilities:
  max-homes: 3
  rtp-radius: 3000
  rtp-cooldown-seconds: 600
  tpa-cost: 10 # legacy fallback; distance prices below are used by /tpa
  tpa-nether-fixed-cost: 66
  tpa-prices:
    up-to-250: 10
    up-to-1000: 20
    up-to-3000: 30
    up-to-6000: 40
    up-to-10000: 50
    over-10000: 75
  back-cost: 30

