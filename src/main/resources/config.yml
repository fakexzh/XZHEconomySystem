# XZHEconomySystem 1.0.0
currency-name: coins
currency-name-singular: coin
starting-balance: 100.0
minimum-pay: 1.0
maximum-pay: 1000000.0

# Physical pocket coins. Excess pocket funds are automatically secured in the bank.
wallet:
  max-pocket-coins: 1000000

# Bank settings. Hours use Minecraft time from the configured clock world (default world).
# Minecraft time 09:00 is tick 3000; 20:00 is tick 14000.
bank:
  clock-world: world
  open-hour: 9
  close-hour: 20

# Global announcements: only noteworthy shop purchases; borrowing and full loan repayments.
announcements:
  shop:
    enabled: true
    minimum-purchase-total: 1000
    rare-items:
      - ELYTRA
      - NETHERITE_INGOT
      - ENCHANTED_GOLDEN_APPLE
      - TOTEM_OF_UNDYING
      - TRIDENT
      - MACE
      - WITHER_SKELETON_SKULL
      - SILENCE_ARMOR_TRIM_SMITHING_TEMPLATE
    progression-items:
      - ELYTRA
  loan:
    borrowing: true
    full-repayment: true
  bank:
    enabled: true

# HUD settings
hud:
  clock:
    enabled: true
    format: "HH:mm"
  scoreboard:
    enabled: true
    position: sidebar
  quest-bossbar:
    enabled: true

# Death inventory recovery. Recovery is available for 30 minutes, up to twice per day.
death-recovery:
  overworld-only: true
  fee-multiplier: 1.5
  xp-value-per-point: 0.25
  material-values:
    elytra: 2500
    netherite_ingot: 600
    netherite_scrap: 150
    diamond: 125
    diamond_block: 720
    ancient_debris: 120
    mending: 100

# Shop buy-stock caps are shared by every player and refill daily.\n# Resale values are deliberately item-specific in code; legacy 30% sell defaults are not used.
