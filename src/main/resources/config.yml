# XZHEconomySystem 1.0.0
currency-name: coins
starting-balance: 100.0
minimum-pay: 1.0
maximum-pay: 1000000.0

# HUD settings
hud:
  scoreboard:
    enabled: true
    position: sidebar
  quest-bossbar:
    enabled: true

# Death inventory recovery. Recovery is available for 30 minutes, up to twice per day.
death-recovery:
  overworld-only: true
  fee-multiplier: 1.5
  xp-value-per-point: 0.25
  material-values:
    elytra: 2500
    netherite_ingot: 300
    diamond: 80
    diamond_block: 720
    ancient_debris: 120
    mending: 100

# Global shop stock caps. Stock is shared by every player and refills to these caps daily.
shop:
  default-sell-price: 0.1
  prices:
    elytra:
      buy: 5000
      sell: 1500
    diamond:
      buy: 250
      sell: 75
    iron_ingot:
      buy: 25
      sell: 7.5
    cooked_beef:
      buy: 14
      sell: 4.2
  stock-limits:
    coal: 2000
    iron_ingot: 1000
    gold_ingot: 500
    diamond: 250
    obsidian: 250
    bread: 1000
    cooked_beef: 1000
    iron_pickaxe: 100
    diamond_pickaxe: 30
    iron_chestplate: 100
    diamond_sword: 30
    experience_bottle: 200
    potion: 100
    zombie_head: 10
    chicken_spawn_egg: 10
    cow_spawn_egg: 5
    sheep_spawn_egg: 5
    pig_spawn_egg: 5
    egg: 2000
    elytra: 3

# Player utility limits.
utilities:
  max-homes: 3
  rtp-radius: 3000
  rtp-cooldown-seconds: 600

# Enchantment book shop rules.
book-shop:
  cooldown-hours: 24
  rare-daily-stock: 3
  normal-daily-stock: 100
  prices:
    mending: 1200
    wind_burst: 1500
    swift_sneak: 700
    soul_speed: 700
    frost_walker: 700
    fortune: 600
    silk_touch: 600
    unbreaking: 600
    efficiency: 600
    looting: 600
    sharpness: 500
    protection: 500
    feather_falling: 500
    power: 500
