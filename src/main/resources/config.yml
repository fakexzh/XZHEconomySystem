# XZHEconomySystem 1.0.0
currency-name: coins
starting-balance: 100.0
minimum-pay: 1.0
maximum-pay: 1000000.0

# HUD settings
hud:
  scoreboard:
    enabled: true
    position: sidebar
  quest-bossbar:
    enabled: true

# Death inventory recovery. Recovery is available for 30 minutes, up to twice per day.
death-recovery:
  fee-multiplier: 1.5
  xp-value-per-point: 0.25
  material-values:
    elytra: 2500
    netherite_ingot: 300
    diamond: 80
    diamond_block: 720
    ancient_debris: 120
    mending: 100

# Global shop stock caps. Stock is shared by every player and refills to these caps daily.
shop:
  default-sell-price: 0.1
  stock-limits:
    coal: 2000
    iron_ingot: 1000
    gold_ingot: 500
    diamond: 250
    obsidian: 250
    bread: 1000
    cooked_beef: 1000
    iron_pickaxe: 100
    diamond_pickaxe: 30
    elytra: 3

# Player utility limits.
utilities:
  max-homes: 3
  rtp-radius: 3000
  rtp-cooldown-seconds: 600
