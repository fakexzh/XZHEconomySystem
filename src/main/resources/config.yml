# Quest pack stock resets to these values each server-local day.
quests:
  pack-stock:
    beginner: 50
    miner: 30
    hunter: 25
    explorer: 15
    nether: 10
    end: 5
  global-event:
    goal: 500
    reward: 100
    claims-per-day: 25

# Configurable gameplay restrictions.
restrictions:
  disable-librarian-enchanted-book-trades: true
  elytra-requires-end-visit: true
  buy-only-spawn-eggs: true

# Player utility limits.
utilities:
  max-homes: 3
  rtp-radius: 3000
  rtp-cooldown-seconds: 600
  tpa-cost: 10
  back-cost: 30

# Enchantment book shop rules.
book-shop:
  cooldown-hours: 24
  rare-daily-stock: 3
  normal-daily-stock: 100
  prices:
    mending: 1200
    wind_burst: 1500
    swift_sneak: 700
    soul_speed: 700
    frost_walker: 700
    fortune: 600
    silk_touch: 600
    unbreaking: 600
    efficiency: 600
    looting: 600
    sharpness: 500
    protection: 500
    feather_falling: 500
    power: 500

# Configurable starter kit; items use MATERIAL:AMOUNT syntax.
kits:
  starter:
    cooldown-hours: 24
    items:
      - STONE_PICKAXE:1
      - BREAD:8
      - TORCH:16

# Travel shop restrictions. Spawn eggs can still be purchased from the Travel menu.
travel:
  disable-natural-horse-donkey-spawning: true
  disable-horse-donkey-breeding: true

# XZH premium boats. Prices are defined by the curated BoatManager offers.
premium-boats:
  enabled: true
  disable-crafting: true
  speed-cap:
    basic: 0.25
    aura: 0.34
    super: 0.46
