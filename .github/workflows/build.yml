name: Build plugin
on:
  workflow_dispatch:
  push:
    branches: [ main, master, integrated-release, E-B002 ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: gradle clean build
      - name: Package source archive
        run: git archive --format=zip --output=build/XZHEconomySystem-source.zip HEAD
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: XZHEconomySystem-E-B002
          path: build/libs/XZHEconomySystem-1.0.0.jar
      - name: Package coin resource pack
        run: |
          mkdir -p build
          cd resource-pack
          zip -r ../build/XZH-Coin-Resource-Pack.zip .
      - name: Upload coin resource pack
        uses: actions/upload-artifact@v4
        with:
          name: XZH-Coin-Resource-Pack
          path: build/XZH-Coin-Resource-Pack.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: XZHEconomySystem-E-B002-source
          path: build/XZHEconomySystem-source.zip
