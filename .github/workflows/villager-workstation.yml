name: Build VillagerWorkstation

on:
  push:
    branches:
      - main
      - master
      - feature/villager-workstation-plugin
    paths:
      - "VillagerWorkstation/**"
      - ".github/workflows/villager-workstation.yml"
  pull_request:
    paths:
      - "VillagerWorkstation/**"
      - ".github/workflows/villager-workstation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VillagerWorkstation
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: gradle --no-daemon clean test build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VillagerWorkstation-0.1.0
          path: VillagerWorkstation/build/libs/VillagerWorkstation-0.1.0.jar
          if-no-files-found: error
